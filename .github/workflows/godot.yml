name: Godot Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Godot project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q Godot_v4.7.2-stable_linux.x86_64.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Check Godot version
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Validate project
        run: |
          ./Godot_v4.7.2-stable_linux.x86_64 \
            --headless \
            --path . \
            --editor \
            --quit
